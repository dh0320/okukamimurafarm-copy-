    <style>
        /* Design Tokens & Theme Variables */
        :root {
            /* Base Colors (Natural Modern) */

        /* Phase 2: Slight Unease */
        [data-phase="2"] {
            --bg: #F5F5F0;
            --text: #2C2F2D;
            --muted: #6C726E;
            filter: contrast(0.95) sepia(0.1);
        }

        /* Phase 3: Horror */
        [data-phase="3"] {
            --bg: #EAE8E0;
            --text: #111;
            --surface: #F9F7F2;
            --primary: #1A3E24;
            filter: contrast(1.1) grayscale(0.3) brightness(0.9);
        }

        /* Phase 4: Nightmare */
        [data-phase="4"] {
            --bg: #0F1210;
            --surface: #1C1F1D;
            --surface-2: #2A2F2B;
            --text: #D1D5DB;
            --muted: #9CA3AF;
            --border: #374151;
            --primary: #8C7A52; /* Eerie sepia */
            --primary-2: #6F603F;
            --accent: #CBBF94;
            filter: contrast(1.2) grayscale(0.8);
        }

        /* --- 本格ホラー演出用の追加スタイル --- */
        
        /* 画面全体のノイズアニメーション */
        @keyframes noise-anim {
            0% { clip-path: inset(40% 0 61% 0); transform: skew(0.7deg); }
            20% { clip-path: inset(92% 0 1% 0); transform: skew(0.5deg); }
            40% { clip-path: inset(43% 0 1% 0); transform: skew(0.2deg); }
            60% { clip-path: inset(25% 0 58% 0); transform: skew(0.7deg); }
            80% { clip-path: inset(54% 0 7% 0); transform: skew(0.1deg); }
            100% { clip-path: inset(58% 0 43% 0); transform: skew(0.6deg); }
        }

        /* 不気味な暗色オーバーレイとノイズ */
        .horror-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(8, 10, 6, 0.82);
            z-index: 9999;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            mix-blend-mode: multiply;
            overflow: hidden;
        }

        .horror-overlay::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://raw.githubusercontent.com/dh0320/okukamimurafarm/f273d82bcc2d0c08371bb0e42d3169c3d36e4b9b/images/villagenight.png') no-repeat center center;
            background-size: cover;
            opacity: 0.3;
            filter: grayscale(100%) contrast(200%);
            mix-blend-mode: overlay;
            animation: noise-anim 0.15s infinite;
        }

        /* 周辺減光（トンネル効果） */
        .horror-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, #000 90%);
            z-index: 10000;
            pointer-events: none;
        }

        /* 激しいテキストグリッチと振動 */
        .intense-glitch {
            font-family: 'Yuji Syuku', serif !important;
            color: #ffffff !important;
            position: relative;
            display: inline-block;
            font-size: 1.8rem !important;
            font-weight: 900;
            text-shadow: 2px 2px 0px #8A2E2E, -2px -2px 0 #000;
            animation: text-shake 0.1s infinite;
            letter-spacing: 0.1em;
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.8));
        }
        
        @keyframes text-shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(2px, 2px) rotate(1deg); }
            50% { transform: translate(-2px, -2px) rotate(-1deg); }
            75% { transform: translate(-2px, 2px) rotate(0.5deg); }
            100% { transform: translate(2px, -2px) rotate(-0.5deg); }
        }

        /* チェックボックス自体の歪み */
        .distorted-checkbox {
            filter: invert(1) drop-shadow(0 0 5px red);
            transform: scale(1.2);
        }

        /* 画像用グリッチエフェクト (園長変化用) */
        @keyframes image-glitch {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            20% { transform: translate(-2px, 2px); filter: hue-rotate(90deg) contrast(1.2); }
            40% { transform: translate(-2px, -2px); filter: hue-rotate(0deg) invert(0.1); }
            60% { transform: translate(2px, 2px); filter: hue-rotate(-90deg) contrast(1.5); }
            80% { transform: translate(2px, -2px); filter: hue-rotate(0deg); }
            100% { transform: translate(0); filter: hue-rotate(0deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .horror-overlay::before,
            .intense-glitch,
            .image-glitching {
                animation: none !important;
            }
        }

        .image-glitching {
            animation: image-glitch 0.2s infinite;
            filter: contrast(1.2) brightness(0.8) sepia(0.5) hue-rotate(-50deg) !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--muted);
            border-radius: 99px;
        }

        /* F01: 選択すると見える隠し文 */
        .hidden-sos {
            color: transparent;
            user-select: text;
        }
        .hidden-sos::selection {
            color: #8A2E2E;

        }
        .hidden-sos::-moz-selection {
            color: #8A2E2E;
            background: rgba(138, 46, 46, 0.25);
        }
        
        /* --- HOME：こだわり用 Apple Rain --- */
        @keyframes apple-fall {
          0%   { transform: translate3d(0,-120px,0) rotate(0deg);   opacity: 0; }
          10%  { opacity: 1; }
          100% { transform: translate3d(0, calc(100vh + 140px), 0) rotate(360deg); opacity: 1; }
        }
        
        .apple-rain-layer{
          position: fixed;
          inset: 0;
          z-index: 95;
          overflow: hidden;
          pointer-events: none; /* 普通のページ操作を邪魔しない */
        }
        
        .apple-drop{
          position: absolute;
          top: -140px;
          animation-name: apple-fall;
          animation-timing-function: linear;
          animation-fill-mode: forwards;
          will-change: transform;
          user-select: none;
          filter: drop-shadow(0 8px 10px rgba(0,0,0,0.18));
        }
        
        .apple-drop.odd{
          pointer-events: auto;  /* 色違いだけクリック可 */
          cursor: pointer;
          filter: drop-shadow(0 10px 14px rgba(0,0,0,0.26));
        }
        /* ===== Tap Hit Area Fix（🍏だけ当たり判定を広げる）===== */
        
        /* 通常りんごはクリック不可（誤タップ防止）
           ※すでに .apple-rain-layer { pointer-events:none } でも効くので、
           もし既存で .apple-drop が pointer-events を持っているなら上書きされます */
        .apple-drop {
          pointer-events: none;
        }
        
        /* 🍏だけクリック可＆当たり判定を広げる（見た目は変えない） */
        .apple-drop.odd{
          pointer-events: auto;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;     /* ←ここが当たり判定。好みで 12〜28px */
          line-height: 1;
        }

        /* Ending page fade-in animation */
        @keyframes ending-fade-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ending-fade-in {
            opacity: 0;
            animation: ending-fade-up 0.8s ease-out forwards;
        }

        /* Page transition */
        @keyframes page-fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .page-fade-in {
            animation: page-fade-in 0.35s ease-out;
        }

    </style>
    
    
    
</head>

    <noscript>
        <div style="max-width:900px;margin:0 auto;padding:40px 20px;font-family:'Noto Sans JP',sans-serif;color:#1C1F1D;line-height:1.8;">
            <header style="text-align:center;margin-bottom:48px;">
                <h1 style="font-family:'Shippori Mincho',serif;font-size:2rem;color:#2F6B3E;">奥神伏ファーム</h1>
                <p style="font-size:1.1rem;color:#5C625E;">土と生きる、循環する未来。</p>
                <p>長野県奥神伏村の有機農園。農薬不使用のりんご・ぶどう・自家製ジャムをお届けします。</p>
            </header>

            <section style="margin-bottom:48px;">
                <h2 style="font-family:'Shippori Mincho',serif;font-size:1.5rem;color:#2F6B3E;border-bottom:2px solid #2F6B3E;padding-bottom:8px;">農園について ― ABOUT US</h2>
                <h3>園長ご挨拶</h3>
                <p>奥神伏ファーム園長の神去と申します。当農園は、長野県奥神伏村の山あいにある小さな有機農園です。農薬を使わず、土の力と季節の巡りを大切にしながら、りんご・ぶどう・季節の野菜を育てています。「土と生きる、循環する未来」を理念に、自然と人が寄り添う農業を続けてまいります。</p>
                <h3>スタッフ紹介</h3>
                <ul>
                    <li><strong>神去 由利</strong>（加工品・農園キッチン担当）― 季節の手しごとで、やさしい味を届けます。収穫した果実の香りや甘みを大切にしながら、ジャムや焼き菓子、季節の保存食を手仕事で仕込んでいます。</li>
                    <li><strong>佐藤 健太</strong>（副園長・Web/広報・体験運営）― 農業を楽しみながら、畑や奥神伏村の魅力を伝えます。農園の運営サポートに加えて、Webサイトやお問い合わせ対応、体験プログラムのご案内を担当しています。</li>
                    <li><strong>グエン・マイ・リン</strong>（技能実習生代表・栽培チーム）― 四季の仕事を学び、丁寧な栽培を支えます。日本の農業の技術と、奥神伏の四季の仕事を学べる毎日が新鮮です。</li>
                </ul>
            </section>

            <section style="margin-bottom:48px;">
                <h2 style="font-family:'Shippori Mincho',serif;font-size:1.5rem;color:#2F6B3E;border-bottom:2px solid #2F6B3E;padding-bottom:8px;">商品一覧 ― PRODUCTS</h2>
                <ul>
                    <li><strong>奥神伏りんご「朱実」</strong>（¥5,000）― 驚くほどの糖度と、深紅の色合い。贈り物にも最適です。</li>
                    <li><strong>手作りアップルパイ</strong>（¥3,500）― 由利さん秘伝のレシピ。サクサクのパイ生地と甘酸っぱいフィリング。</li>
                    <li><strong>奥神伏ぶどう「夜露」</strong>（¥4,500）― 大粒で濃密な甘み。皮ごと食べられる贅沢な一房。</li>
                    <li><strong>特製ジャム</strong>（¥1,200）― 素材の味をそのまま閉じ込めた手作りジャム。パンにも紅茶にも。</li>
                    <li><strong>季節のおまかせセット</strong>（¥8,000）― 旬の果実と加工品を詰め合わせたギフトセット。</li>
                </ul>
            </section>

            <section style="margin-bottom:48px;">
                <h2 style="font-family:'Shippori Mincho',serif;font-size:1.5rem;color:#2F6B3E;border-bottom:2px solid #2F6B3E;padding-bottom:8px;">活動日誌 ― FARM DIARY</h2>

                <article style="margin-bottom:32px;">
                    <h3>2026.01.18 ― 野菜の収穫</h3>
                    <p>「奥神伏ファーム＝りんご」のイメージを持ってくださる方が多いのですが、実は野菜もたくさん育てています。今日は、畑の野菜をまとめて収穫しました！土から引き上げた瞬間に分かる、根の張り具合。葉の張り、色、香り。手に取るだけで「よく育ってくれたなあ」と思える瞬間があって、これが畑の仕事の醍醐味です。収穫できたのは、みずみずしい葉物、甘みののった根菜、料理が楽しくなるハーブなど、食卓がぐっと豊かになるものばかり。これからも、果実も野菜も、奥神伏の季節をそのまま感じられる味をお届けできるよう、丁寧に育てていきます。</p>
                </article>

                <article style="margin-bottom:32px;">
                    <h3>2026.01.10 ― 村の子供達とアップルパイ作り体験！</h3>
                    <p>先日、村の子どもたちと一緒にアップルパイ作り体験をしました。エプロン姿で集まってくるだけで、キッチンが一気ににぎやかに。りんごを切る音、笑い声、甘い香り…この時間だけで「やってよかったなあ」と思えます。今回使ったりんごは、しっかり甘みがのったものを選んで、シナモンは控えめに。小さな手でも扱いやすいように、りんごは少し薄めにカットして、火入れも短時間で仕上げました。「おうちでも作りたい！」という声が多かったので、リクエストにお応えしてレシピもまとめました。</p>
                </article>

                <article style="margin-bottom:32px;">
                    <h3>2026.01.05 ― みんなでご飯作り</h3>
                    <p>今日は少し手が空いたタイミングで、農園のみんなでランチ作り。「せっかくだし、畑の野菜を思いっきり使おう！」ということで、野菜たっぷりのピザを焼きました。畑から採ってきたのは、ズッキーニ、玉ねぎ、ほうれん草、ミニトマト、そして香りの良いハーブ。焼き上がりは、外はカリッと中はもちっと。野菜がじゅわっと甘くて、思わず無言になるおいしさでした。農園の日常は派手じゃないけれど、こういう小さな"ご褒美"があると、午後の作業も頑張れます。</p>
                </article>

                <article style="margin-bottom:32px;">
                    <h3>2026.01.01 ― 新年のご挨拶</h3>
                    <p>あけましておめでとうございます。奥神伏ファームです。旧年中は、私たちの農園を見つけてくださり、温かい言葉や応援をたくさんありがとうございました。冬の奥神伏は、空気がきりっと澄んでいて、朝は畑が白くふわっと霜で覆われます。今年も、旬の果実や野菜のこと、収穫や加工の裏側、体験イベントの様子、村の四季の風景を、写真と一緒に日誌でこまめにお届けしていく予定です。本年も奥神伏ファームを、どうぞよろしくお願いいたします。</p>
                </article>
            </section>

            <section style="margin-bottom:48px;">
                <h2 style="font-family:'Shippori Mincho',serif;font-size:1.5rem;color:#2F6B3E;border-bottom:2px solid #2F6B3E;padding-bottom:8px;">奥神伏村 ― OUR VILLAGE</h2>
                <p>奥神伏村は、長野県の山深い場所にある、人口わずか数百人の小さな集落です。澄んだ空気と清らかな水に恵まれ、四季折々の豊かな自然に囲まれています。春は桜と山菜、夏は緑深い渓流、秋は紅葉と収穫、冬は静寂の銀世界。この美しい環境の中で、私たちは土と向き合い、季節の恵みを大切に育てています。</p>
            </section>

            <section style="margin-bottom:48px;">
                <h2 style="font-family:'Shippori Mincho',serif;font-size:1.5rem;color:#2F6B3E;border-bottom:2px solid #2F6B3E;padding-bottom:8px;">アクセス ― ACCESS</h2>
