    <style>
        /* Design Tokens & Theme Variables */
        :root {
            /* Base Colors (Natural Modern) */
            --bg: #FAFAF7;
            --surface: #FFFFFF;
            --surface-2: #F3F4F0;
            --text: #1C1F1D;
            --muted: #5C625E;
            --border: #E6E8E2;
            --primary: #2F6B3E;
            --primary-2: #214E2C;
            --accent: #8A2E2E; /* Horror Accent */
            
            /* Spacing */
            --header-height: 88px;
        }

        /* Phase 2: Slight Unease */
        [data-phase="2"] {
            --bg: #F5F5F0;
            --text: #2C2F2D;
            --muted: #6C726E;
            filter: contrast(0.95) sepia(0.1);
        }

        /* Phase 3: Horror */
        [data-phase="3"] {
            --bg: #EAE8E0;
            --text: #111;
            --surface: #F9F7F2;
            --primary: #1A3E24;
            filter: contrast(1.1) grayscale(0.3) brightness(0.9);
        }

        /* Phase 4: Nightmare */
        [data-phase="4"] {
            --bg: #0F1210;
            --surface: #1C1F1D;
            --surface-2: #2A2F2B;
            --text: #D1D5DB;
            --muted: #9CA3AF;
            --border: #374151;
            --primary: #8C7A52; /* Eerie sepia */
            --primary-2: #6F603F;
            --accent: #CBBF94;
            filter: contrast(1.2) grayscale(0.8);
        }

        /* --- 本格ホラー演出用の追加スタイル --- */
        
        /* 画面全体のノイズアニメーション */
        @keyframes noise-anim {
            0% { clip-path: inset(40% 0 61% 0); transform: skew(0.7deg); }
            20% { clip-path: inset(92% 0 1% 0); transform: skew(0.5deg); }
            40% { clip-path: inset(43% 0 1% 0); transform: skew(0.2deg); }
            60% { clip-path: inset(25% 0 58% 0); transform: skew(0.7deg); }
            80% { clip-path: inset(54% 0 7% 0); transform: skew(0.1deg); }
            100% { clip-path: inset(58% 0 43% 0); transform: skew(0.6deg); }
        }

        /* 不気味な暗色オーバーレイとノイズ */
        .horror-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(8, 10, 6, 0.82);
            z-index: 9999;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            mix-blend-mode: multiply;
            overflow: hidden;
        }

        .horror-overlay::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://raw.githubusercontent.com/dh0320/okukamimurafarm/f273d82bcc2d0c08371bb0e42d3169c3d36e4b9b/images/villagenight.png') no-repeat center center;
            background-size: cover;
            opacity: 0.3;
            filter: grayscale(100%) contrast(200%);
            mix-blend-mode: overlay;
            animation: noise-anim 0.15s infinite;
        }

        /* 周辺減光（トンネル効果） */
        .horror-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, #000 90%);
            z-index: 10000;
            pointer-events: none;
        }

        /* 激しいテキストグリッチと振動 */
        .intense-glitch {
            font-family: 'Yuji Syuku', serif !important;
            color: #ffffff !important;
            position: relative;
            display: inline-block;
            font-size: 1.8rem !important;
            font-weight: 900;
            text-shadow: 2px 2px 0px #8A2E2E, -2px -2px 0 #000;
            animation: text-shake 0.1s infinite;
            letter-spacing: 0.1em;
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.8));
        }
        
        @keyframes text-shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(2px, 2px) rotate(1deg); }
            50% { transform: translate(-2px, -2px) rotate(-1deg); }
            75% { transform: translate(-2px, 2px) rotate(0.5deg); }
            100% { transform: translate(2px, -2px) rotate(-0.5deg); }
        }

        /* チェックボックス自体の歪み */
        .distorted-checkbox {
            filter: invert(1) drop-shadow(0 0 5px red);
            transform: scale(1.2);
        }

        /* 画像用グリッチエフェクト (園長変化用) */
        @keyframes image-glitch {
            0% { transform: translate(0); filter: hue-rotate(0deg); }
            20% { transform: translate(-2px, 2px); filter: hue-rotate(90deg) contrast(1.2); }
            40% { transform: translate(-2px, -2px); filter: hue-rotate(0deg) invert(0.1); }
            60% { transform: translate(2px, 2px); filter: hue-rotate(-90deg) contrast(1.5); }
            80% { transform: translate(2px, -2px); filter: hue-rotate(0deg); }
            100% { transform: translate(0); filter: hue-rotate(0deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .horror-overlay::before,
            .intense-glitch,
            .image-glitching {
                animation: none !important;
            }
        }

        [data-reduce-motion="true"] .horror-overlay::before,
        [data-reduce-motion="true"] .intense-glitch,
        [data-reduce-motion="true"] .image-glitching {
            animation: none !important;
        }
        
        .image-glitching {
            animation: image-glitch 0.2s infinite;
            filter: contrast(1.2) brightness(0.8) sepia(0.5) hue-rotate(-50deg) !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--muted);
            border-radius: 99px;
        }

        /* F01: 選択すると見える隠し文 */
        .hidden-sos {
            color: transparent;
            user-select: text;
        }
        .hidden-sos::selection {
            color: #8A2E2E;
            background: rgba(138, 46, 46, 0.25);
        }
        .hidden-sos::-moz-selection {
            color: #8A2E2E;
            background: rgba(138, 46, 46, 0.25);
        }
        
        /* --- HOME：こだわり用 Apple Rain --- */
        @keyframes apple-fall {
          0%   { transform: translate3d(0,-120px,0) rotate(0deg);   opacity: 0; }
          10%  { opacity: 1; }
          100% { transform: translate3d(0, calc(100vh + 140px), 0) rotate(360deg); opacity: 1; }
        }
        
        .apple-rain-layer{
          position: fixed;
          inset: 0;
          z-index: 95;
          overflow: hidden;
          pointer-events: none; /* 普通のページ操作を邪魔しない */
        }
        
        .apple-drop{
          position: absolute;
          top: -140px;
          animation-name: apple-fall;
          animation-timing-function: linear;
          animation-fill-mode: forwards;
          will-change: transform;
          user-select: none;
          filter: drop-shadow(0 8px 10px rgba(0,0,0,0.18));
        }
        
        .apple-drop.odd{
          pointer-events: auto;  /* 色違いだけクリック可 */
          cursor: pointer;
          filter: drop-shadow(0 10px 14px rgba(0,0,0,0.26));
        }
        /* ===== Tap Hit Area Fix（🍏だけ当たり判定を広げる）===== */
        
        /* 通常りんごはクリック不可（誤タップ防止）
           ※すでに .apple-rain-layer { pointer-events:none } でも効くので、
           もし既存で .apple-drop が pointer-events を持っているなら上書きされます */
        .apple-drop {
          pointer-events: none;
        }
        
        /* 🍏だけクリック可＆当たり判定を広げる（見た目は変えない） */
        .apple-drop.odd{
          pointer-events: auto;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;     /* ←ここが当たり判定。好みで 12〜28px */
          line-height: 1;
        }

        /* Ending page fade-in animation */
        @keyframes ending-fade-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ending-fade-in {
            opacity: 0;
            animation: ending-fade-up 0.8s ease-out forwards;
        }

        /* Page transition */
        @keyframes page-fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .page-fade-in {
            animation: page-fade-in 0.35s ease-out;
        }

    </style>
    
    
    
</head>

                desc: "リンゴだけでなく美味しい野菜もたくさんとれます！神様に感謝です！",
                img: IMAGES.blog_harvest,
                content: `「奥神伏ファーム＝りんご」のイメージを持ってくださる方が多いのですが、実は野菜もたくさん育てています。\n今日は、畑の野菜をまとめて収穫しました！\n\n土から引き上げた瞬間に分かる、根の張り具合。\n葉の張り、色、香り。\n手に取るだけで「よく育ってくれたなあ」と思える瞬間があって、これが畑の仕事の醍醐味です。\n\n収穫できたのは、\n・みずみずしい葉物\n・甘みののった根菜\n・料理が楽しくなるハーブ\nなど、食卓がぐっと豊かになるものばかり。\n\n自然相手の仕事なので、うまくいかない日もあります。\nそれでも、太陽と雨と土、そして人の手がそろって「実り」になったときは、やっぱり胸がいっぱいになります。神様に感謝です。\n\nこれからも、果実も野菜も、奥神伏の季節をそのまま感じられる味をお届けできるよう、丁寧に育てていきます。\n収穫の様子は写真でもたっぷり掲載しますので、ぜひのぞいてくださいね。`

                            <button
                                type="button"
                                className="mt-2 w-full text-left text-[10px] px-2 py-1 rounded bg-white/15 hover:bg-white/25 transition-colors"
                                onClick={() => setPage('debug')}
                            >
                                デバッグページを開く
                            </button>
                            <button
                                type="button"
                                className="mt-2 w-full text-left text-[10px] px-2 py-1 rounded bg-white/15 hover:bg-white/25 transition-colors"
                                onClick={resetFlagsForDebug}
                            >
                                フラグをリセット（デバッグ）
                            </button>
                        </div>
                        )}
                    </div>
                    <MessageModal
                        isOpen={evidenceModal.isOpen}
                        message={evidenceModal.message}
                        isHorror={evidenceModal.isHorror}
                        onClose={() => setEvidenceModal({ ...evidenceModal, isOpen: false })}
                    />
                    <EvidenceToast
                        isOpen={evidenceToast.isOpen}
                        message={evidenceToast.message}
                        isHorror={evidenceToast.isHorror}
                        onClose={() => setEvidenceToast(prev => ({ ...prev, isOpen: false }))}
                    />
                    <CookieConsent setPage={setPage} />
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
